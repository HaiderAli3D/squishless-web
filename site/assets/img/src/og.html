<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og image source</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/img/src/og.css">
</head>
<body>
<main class="og">
  <div class="og__copy">
    <img class="og__logo" src="/assets/img/logo.svg" alt="">
    <h1 class="og__title">Resize photos without the squish.</h1>
    <p class="og__sub">Free, private, and it runs right in your browser.</p>
  </div>
  <div class="og__pics">
    <figure class="og__pic og__pic--normal">
      <img src="/assets/img/demo-portrait-normal.jpg" alt="">
      <figcaption>Normal resize</figcaption>
    </figure>
    <figure class="og__pic og__pic--sq">
      <img src="/assets/img/demo-portrait-squishless.jpg" alt="">
      <figcaption>Squishless</figcaption>
    </figure>
  </div>
</main>
</body>
</html>
